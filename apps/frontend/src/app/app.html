<mat-sidenav-container class="app-shell">
  <mat-sidenav mode="side" opened class="app-sidenav">
    <div class="brand">
      <div class="brand-logo">
        <mat-icon>workspaces</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-title">{{ title }}</span>
        <span class="brand-subtitle">Admin Console</span>
      </div>
    </div>

    <mat-nav-list class="app-nav-list">
      @for (item of navItems; track item.path) {
      <a
        mat-list-item
        [routerLink]="item.path"
        routerLinkActive="active-link"
        class="nav-link"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-icon>info</mat-icon>
      <span>Workshop v1.0</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="app-content-wrapper">
    <mat-toolbar class="app-toolbar">
      <span class="app-toolbar-title">{{ title }}</span>
      <span class="spacer"></span>

      <button
        matIconButton
        type="button"
        [attr.aria-label]="themeTooltip()"
        [matTooltip]="themeTooltip()"
        (click)="toggleTheme()"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>

      <button
        matIconButton
        aria-label="Notifications"
        matTooltip="Notifications"
      >
        <mat-icon>notifications</mat-icon>
      </button>
      <button matIconButton aria-label="Account" matTooltip="Account">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
