<app-order
  [orders]="orders()"
  [users]="users()"
  [loading]="loading()"
  (add)="onAdd()"
  (edit)="onEdit($event)"
  (remove)="onDelete($event)"
/>

@if (creating() || editing()) {
<app-order-form
  [order]="editing()"
  [users]="users()"
  (save)="onSave($event)"
  (cancelled)="closeForm()"
/>
}
