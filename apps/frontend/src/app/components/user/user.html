@let list = users();

<mat-card appearance="outlined" class="data-card">
  <div class="card-header">
    <div class="card-title">
      <h2>Users</h2>
      <span class="count-chip">{{ list.length }}</span>
    </div>
    <button matButton="filled" type="button" (click)="add.emit()">
      <mat-icon>add</mat-icon>
      Add user
    </button>
  </div>

  @if (loading()) {
  <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="list" class="data-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="surname">
        <th mat-header-cell *matHeaderCellDef>Surname</th>
        <td mat-cell *matCellDef="let user">{{ user.surname }}</td>
      </ng-container>

      <ng-container matColumnDef="birthYear">
        <th mat-header-cell *matHeaderCellDef>Birth year</th>
        <td mat-cell *matCellDef="let user">{{ user.birthYear }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-cell">Actions</th>
        <td mat-cell *matCellDef="let user" class="actions-cell">
          <button
            matIconButton
            type="button"
            matTooltip="Edit"
            aria-label="Edit user"
            class="edit-btn"
            (click)="edit.emit(user)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            matTooltip="Delete"
            aria-label="Delete user"
            class="danger-button"
            (click)="remove.emit(user.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  @if (list.length === 0 && !loading()) {
  <div class="empty">
    <mat-icon>inbox</mat-icon>
    <p>No users yet.</p>
  </div>
  }
</mat-card>
