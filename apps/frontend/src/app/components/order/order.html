@let list = rows();

<mat-card appearance="outlined" class="data-card">
  <div class="card-header">
    <div class="card-title">
      <h2>Orders</h2>
      <span class="count-chip">{{ list.length }}</span>
    </div>
    <button matButton="filled" type="button" (click)="add.emit()">
      <mat-icon>add</mat-icon>
      Add order
    </button>
  </div>

  @if (loading()) {
  <mat-progress-bar mode="indeterminate" />
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="list" class="data-table">
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let row">
          <span class="user-chip">{{ row.userLabel }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let row">{{ row.productName }}</td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef>Quantity</th>
        <td mat-cell *matCellDef="let row">{{ row.quantity }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef class="amount-cell">Amount</th>
        <td mat-cell *matCellDef="let row" class="amount-cell">
          {{ row.amount | currency }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-cell">Actions</th>
        <td mat-cell *matCellDef="let row" class="actions-cell">
          <button
            matIconButton
            type="button"
            matTooltip="Edit"
            aria-label="Edit order"
            class="edit-btn"
            (click)="edit.emit(row)"
          >
            <mat-icon>edit</mat-icon>
          </button>
          <button
            matIconButton
            type="button"
            matTooltip="Delete"
            aria-label="Delete order"
            class="danger-button"
            (click)="remove.emit(row.id)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  @if (list.length === 0 && !loading()) {
  <div class="empty">
    <mat-icon>inbox</mat-icon>
    <p>No orders yet.</p>
  </div>
  }
</mat-card>
