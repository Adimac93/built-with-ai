[package]
name = "frontend"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "HtmlElement", "Storage", "CssStyleDeclaration"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = "s"
lto = true
