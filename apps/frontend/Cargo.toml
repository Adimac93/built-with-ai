[package]
name = "frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["router", "fullstack"] }
serde = { workspace = true }
serde_json = { workspace = true }

# client-only (compile to no-ops or are unused on the server target)
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomTokenList", "HtmlElement", "Storage", "CssStyleDeclaration"] }

# server-only
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["signal"] }
reqwest = { workspace = true, optional = true, features = ["rustls"] }
tracing = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:reqwest",
    "dep:tracing",
]
