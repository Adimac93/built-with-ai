[package]
name = "agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["signal", "sync"] }
tower-http = { workspace = true, features = ["cors", "limit", "timeout"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# Cloud Logging-compatible JSON layer (severity, sourceLocation) — see
# docs/adr/cloud-run-observability.md
tracing-stackdriver = "0.10"
dotenvy = "0.15"

[dev-dependencies]
tower = { workspace = true }
http-body-util = { workspace = true }
