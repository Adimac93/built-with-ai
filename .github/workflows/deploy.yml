name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

# Rapid pushes to main must not race two deploys of the same services.
concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: built-with-ai-gdg-wroclaw
      REGION: europe-central2
      WORKLOAD_IDENTITY_PROVIDER: 'projects/1062481454649/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
      SERVICE_ACCOUNT: 'github-actions-sa@built-with-ai-gdg-wroclaw.iam.gserviceaccount.com'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/agent:${{ github.sha }} -t gcr.io/${{ env.PROJECT_ID }}/agent:latest -f apps/agent/Dockerfile .
          docker push gcr.io/${{ env.PROJECT_ID }}/agent --all-tags

      - name: Deploy Agent to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: agent
          image: gcr.io/${{ env.PROJECT_ID }}/agent:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global

  deploy-frontend:
    needs: deploy-agent
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: built-with-ai-gdg-wroclaw
      REGION: europe-central2
      WORKLOAD_IDENTITY_PROVIDER: 'projects/1062481454649/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
      SERVICE_ACCOUNT: 'github-actions-sa@built-with-ai-gdg-wroclaw.iam.gserviceaccount.com'
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/frontend:${{ github.sha }} -t gcr.io/${{ env.PROJECT_ID }}/frontend:latest -f apps/frontend/Dockerfile .
          docker push gcr.io/${{ env.PROJECT_ID }}/frontend --all-tags

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: frontend
          image: gcr.io/${{ env.PROJECT_ID }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}

