name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: built-with-ai-gdg-wroclaw
  REGION: us-central1
  # The Workload Identity Provider will be output by our setup script
  # We will fill this in dynamically after running the script, but for now we put a placeholder
  WORKLOAD_IDENTITY_PROVIDER: 'projects/1062481454649/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'github-actions-sa@built-with-ai-gdg-wroclaw.iam.gserviceaccount.com'

jobs:
  deploy-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/agent:${{ github.sha }} -t gcr.io/${{ env.PROJECT_ID }}/agent:latest -f apps/agent/Dockerfile .
          docker push gcr.io/${{ env.PROJECT_ID }}/agent --all-tags

      - name: Deploy Agent to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: agent
          image: gcr.io/${{ env.PROJECT_ID }}/agent:${{ github.sha }}
          region: us-east1
          flags: '--allow-unauthenticated'
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=global

  deploy-frontend:
    needs: deploy-agent
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install just and Dioxus CLI
        uses: cargo-bins/cargo-binstall@main

      - run: cargo binstall -y just dioxus-cli

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build Frontend (Dioxus)
        run: just build-frontend
        env:
          DX_BIN: dx

      - name: Build and Push Docker Image
        run: |
          docker build --platform linux/amd64 -t gcr.io/${{ env.PROJECT_ID }}/frontend:${{ github.sha }} -t gcr.io/${{ env.PROJECT_ID }}/frontend:latest -f apps/frontend/Dockerfile .
          docker push gcr.io/${{ env.PROJECT_ID }}/frontend --all-tags

      - name: Resolve Agent URL
        id: agent
        run: |
          agent_url="$(
            gcloud run services describe agent \
              --platform managed \
              --region us-east1 \
              --project "${{ env.PROJECT_ID }}" \
              --format='value(status.url)'
          )"
          if [[ -z "$agent_url" ]]; then
            echo "Could not resolve AGENT_URL for Cloud Run service 'agent'." >&2
            exit 1
          fi
          echo "url=$agent_url" >> "$GITHUB_OUTPUT"

      - name: Deploy Frontend to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: frontend
          image: gcr.io/${{ env.PROJECT_ID }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          env_vars: |
            AGENT_URL=${{ steps.agent.outputs.url }}
