name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the pinned toolchain, components, and targets
      # from rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install just, dioxus-cli, cargo-deny
        run: cargo binstall -y just dioxus-cli cargo-deny

      - name: Format, lint, deny, test, build
        run: just ci
