[workspace]
resolver = "2"
members = ["apps/agent", "apps/api", "apps/frontend"]

[workspace.package]
version = "1.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true

# WASM bundle size matters more than raw speed for the frontend.
[profile.release.package.frontend]
opt-level = "s"
