# cargo-deny — supply-chain checks run by `just deny` (part of `just ci`).

[graph]
# Lint what we actually ship (both frontend feature sets + agent defaults).
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Workspace crates are publish = false and carry no license field.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
